[project]
name = "hh-resume-project"
version = "0.1.0"
description = "HeadHunter Resume Salary & Career Analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost-cpu>=2.0.0",
    "jinja2>=3.1.0",
    "jupyter>=1.1.1",
    "deep-translator>=1.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
